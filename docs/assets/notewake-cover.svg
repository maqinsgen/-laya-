<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">知灯 Notewake：让重要消息被看见</title>
  <desc id="desc">知灯产品示意，展示虚构读书交流会、时间证据、可撤销反馈和加密手机同步，不含真实用户数据。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1440" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7F6EF"/><stop offset="1" stop-color="#E8EDDF"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#173E35" flood-opacity=".09"/>
    </filter>
  </defs>
  <rect width="1440" height="720" rx="32" fill="url(#bg)"/>
  <g stroke="#173E35" stroke-opacity=".07">
    <circle cx="1260" cy="85" r="315"/><circle cx="1260" cy="85" r="254"/><circle cx="1260" cy="85" r="193"/>
  </g>
  <g font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
    <g transform="translate(82 80) scale(1.2)">
      <rect width="64" height="64" rx="18" fill="#173E35"/>
      <path d="M39 16.5A17 17 0 0 0 15 32c0 5.3 2.5 10.1 6.5 13.2L20 51l9-3.6A17 17 0 0 0 49 30.5" stroke="#F4F5E9" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M33 22c.8 6-8 8-8 14a7.5 7.5 0 0 0 15 0c0-3.8-2.2-6.5-4.4-8.4.5 3.1-1.6 4.7-3.1 5.3C34.4 29 35 25.3 33 22Z" fill="#E3BC73"/>
      <path d="m48 13 1.8 5.2L55 20l-5.2 1.8L48 27l-1.8-5.2L41 20l5.2-1.8L48 13Z" fill="#E3BC73"/>
    </g>
    <text x="179" y="117" fill="#173E35" font-size="33" font-weight="600" letter-spacing="3">知灯</text>
    <text x="180" y="146" fill="#65776B" font-size="17" letter-spacing="3">NOTEWAKE</text>
    <text x="82" y="267" fill="#173E35" font-size="53" font-weight="600">让重要消息</text>
    <text x="82" y="338" fill="#173E35" font-size="53" font-weight="600">被看见。</text>
    <text x="86" y="391" fill="#65776B" font-size="22">理解你的关注，保留判断依据。</text>
    <text x="86" y="428" fill="#65776B" font-size="22">从一次反馈，到下一条更有用的消息。</text>
    <g transform="translate(84 491)">
      <rect width="134" height="40" rx="20" fill="#173E35"/>
      <text x="67" y="26" fill="#F4F5E9" font-size="16" text-anchor="middle">个人反馈</text>
      <rect x="146" width="134" height="40" rx="20" fill="#173E35" fill-opacity=".07"/>
      <text x="213" y="26" fill="#173E35" font-size="16" text-anchor="middle">时间证据</text>
      <rect x="292" width="134" height="40" rx="20" fill="#173E35" fill-opacity=".07"/>
      <text x="359" y="26" fill="#173E35" font-size="16" text-anchor="middle">手机伴侣</text>
    </g>
    <text x="85" y="631" fill="#718175" font-size="15" letter-spacing="1">本地 Laya 实验模式 · 可选云端分析</text>
    <text x="85" y="657" fill="#718175" font-size="14">公开源码 · CC BY-NC-SA 4.0 · 非商业使用</text>
    <g filter="url(#shadow)">
      <rect x="684" y="99" width="665" height="497" rx="24" fill="#FFFFFF"/>
      <rect x="684.5" y="99.5" width="664" height="496" rx="23.5" stroke="#173E35" stroke-opacity=".09"/>
    </g>
    <circle cx="715" cy="130" r="4" fill="#B78B41"/>
    <text x="731" y="136" fill="#65776B" font-size="14">信息助手</text>
    <text x="1319" y="136" fill="#8A978B" font-size="13" text-anchor="end">虚构内容 · 产品示意</text>
    <path d="M709 155H1324" stroke="#E9EDE6"/>
    <rect x="713" y="180" width="71" height="28" rx="8" fill="#F4EBCE"/>
    <text x="748" y="199" fill="#8B6C2D" font-size="14" text-anchor="middle">待处理</text>
    <text x="798" y="199" fill="#718175" font-size="14">读书活动 · 示例通知</text>
    <text x="715" y="253" fill="#173E35" font-size="28" font-weight="600">参加读书交流会</text>
    <text x="715" y="288" fill="#65776B" font-size="17">与你关注的阅读主题有关，时间已人工核对。</text>
    <rect x="713" y="314" width="607" height="104" rx="13" fill="#F5F7F0"/>
    <text x="731" y="342" fill="#718175" font-size="13">时间证据</text>
    <text x="731" y="376" fill="#173E35" font-size="22" font-weight="500">09:00–10:30</text>
    <text x="915" y="375" fill="#65776B" font-size="15">90 分钟 · 提前 30 分钟提醒</text>
    <text x="731" y="401" fill="#718175" font-size="13">可以查看来源、修改时间，再加入日历。</text>
    <rect x="713" y="441" width="139" height="42" rx="11" fill="#173E35"/>
    <text x="782" y="468" fill="#F4F5E9" font-size="16" text-anchor="middle">加入日历</text>
    <rect x="866" y="441" width="114" height="42" rx="11" stroke="#DCE3D7"/>
    <text x="923" y="468" fill="#173E35" font-size="16" text-anchor="middle">有用</text>
    <rect x="994" y="441" width="114" height="42" rx="11" stroke="#DCE3D7"/>
    <text x="1051" y="468" fill="#65776B" font-size="16" text-anchor="middle">没用</text>
    <path d="M713 512H1320" stroke="#E9EDE6"/>
    <circle cx="723" cy="550" r="5" fill="#B78B41"/>
    <text x="739" y="555" fill="#65776B" font-size="15">反馈可撤销 · 影响后续新消息分析</text>
    <rect x="1023" y="578" width="307" height="61" rx="16" fill="#173E35"/>
    <rect x="1045" y="594" width="17" height="28" rx="4" stroke="#E3BC73" stroke-width="1.8"/>
    <path d="M1050 617H1057" stroke="#E3BC73" stroke-width="1.8" stroke-linecap="round"/>
    <text x="1076" y="615" fill="#F4F5E9" font-size="16">加密同步到手机伴侣</text>
  </g>
</svg>
